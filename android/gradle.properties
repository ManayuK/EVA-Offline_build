# ── Daemon ────────────────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# ── Parallelism ───────────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.workers.max=4

# ── Memory ────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8

# ── Caching ───────────────────────────────────────────────────────────────────
org.gradle.caching=true
# Configuration cache disabled — incompatible with KGP + AGP WeakHashMap serialization
org.gradle.configuration-cache=false

# ── On-demand config (skip configuring unused modules) ───────────────────────
org.gradle.configureondemand=true

# ── Android-specific ─────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false
