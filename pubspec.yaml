name: eva_wellness
description: EVA - Emotionally Intelligent Period & Wellness Assistant with On-Device AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^3.8.0 
  # PDF Report
  pdf: ^3.10.8
  open_file: ^3.3.2
  intl: ^0.19.0 

  # UI & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1
  get_it: ^7.6.4

  # Navigation
  go_router: ^12.1.3

  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # On-Device LLM — RunAnywhere (llama.cpp wrapper)
  runanywhere: ^0.15.11
  runanywhere_llamacpp: ^0.15.11

  # On-Device ML — ONNX Runtime (cycle prediction model)
  onnxruntime: 1.4.1

  # Networking
  http: ^1.1.0
  dio: ^5.4.0

  # Charts & Visualization
  fl_chart: ^0.65.0
  table_calendar: ^3.0.9

  # Utils
  uuid: ^4.2.2
  equatable: ^2.0.5
  json_annotation: ^4.8.1

  web: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/ml/cycle_model.onnx
